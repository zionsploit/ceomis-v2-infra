version: '3.8'

name: ceomis_infra

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    # Use host network mode to access host applications
    # network_mode: host
    networks:
      - default
    restart: unless-stopped

  postgres:
    image: postgres:latest
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: perzues_postgres
      POSTGRES_USER: perzues_postgres
      POSTGRES_DB: ceomis
    
    volumes:
      - ceomis_postgres_data:/var/lib/postgresql
    
    ports:
      - "5432:5432"
    networks:
      - default

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis"]
    volumes:
      - redis_data:/usr/local/etc/redis
    ports:
      - "6379:6379"
    
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio_data:/data"
    environment:
      - "MINIO_ROOT_USER=MINIO_USER"
      - "MINIO_ROOT_PASSWORD=MINIO_PASSWORD"
    command: ["server" ,"/data", "--console-address=:9001"]


  # garrage:
  #   image: dxflrs/garage:v2.0.0
